[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read-write", path = "./deployments" },
]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
hsk_testnet = "${HSK_TESTNET_RPC_URL}"
hsk_mainnet = "${HSK_RPC_URL}"
local = "http://127.0.0.1:8545"

[lint]
lint_on_build = false
